<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TODOアプリ</title>

  <!-- ========== スタイル（見た目の設定） ========== -->
  <style>
    /* ページ全体の基本スタイル */
    body {
      font-family: sans-serif;
      background-color: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    /* アプリ全体を囲むコンテナ（中央に配置し、幅を制限する） */
    .container {
      max-width: 500px;
      margin: 0 auto;
      background-color: #fff;
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    /* タイトルのスタイル */
    h1 {
      text-align: center;
      color: #333;
      margin-top: 0;
    }

    /* 入力欄とボタンを横並びにするエリア */
    .input-area {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    /* テキスト入力欄のスタイル */
    .input-area input {
      flex: 1; /* 残りのスペースをすべて使う */
      padding: 10px 12px;
      font-size: 16px;
      border: 2px solid #ddd;
      border-radius: 6px;
      outline: none;
    }

    /* 入力欄にフォーカスしたときの枠線の色 */
    .input-area input:focus {
      border-color: #4a90d9;
    }

    /* 追加ボタンのスタイル */
    .input-area button {
      padding: 10px 20px;
      font-size: 16px;
      background-color: #4a90d9;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    /* 追加ボタンにマウスを乗せたときの色 */
    .input-area button:hover {
      background-color: #357abd;
    }

    /* TODOリスト全体（箇条書きの点を消し、余白をリセット） */
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    /* 各TODOアイテムのスタイル */
    li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      border-bottom: 1px solid #eee;
    }

    /* チェックボックスのサイズ */
    li input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    /* TODOのテキスト部分（クリックで完了切り替えできるように） */
    li span {
      flex: 1;
      font-size: 16px;
      cursor: pointer;
    }

    /* 完了したTODOに取り消し線とグレーの文字色をつける */
    li.done span {
      text-decoration: line-through;
      color: #aaa;
    }

    /* 削除ボタンのスタイル */
    li button {
      background: none;
      border: none;
      color: #e74c3c;
      font-size: 18px;
      cursor: pointer;
      padding: 0 4px;
    }

    /* 削除ボタンにマウスを乗せたときの色 */
    li button:hover {
      color: #c0392b;
    }

    /* TODOが0件のときに表示するメッセージ */
    .empty-message {
      text-align: center;
      color: #aaa;
      padding: 20px;
    }
  </style>
</head>
<body>

  <!-- ========== HTML（画面の構造） ========== -->
  <div class="container">
    <h1>TODO リスト</h1>

    <!-- 新しいTODOを入力するエリア -->
    <div class="input-area">
      <input type="text" id="todo-input" placeholder="やることを入力...">
      <button id="add-button">追加</button>
    </div>

    <!-- TODOの一覧を表示するリスト -->
    <ul id="todo-list"></ul>
  </div>

  <!-- ========== JavaScript（動きの部分） ========== -->
  <script>
    // --- 要素の取得 ---
    // HTMLの中から操作したい要素を取得して変数に入れる
    const todoInput = document.getElementById('todo-input');   // テキスト入力欄
    const addButton = document.getElementById('add-button');   // 追加ボタン
    const todoList = document.getElementById('todo-list');     // TODOリスト（ul要素）

    // --- TODOデータの読み込み ---
    // ブラウザのlocalStorageに保存されたTODOデータを読み込む
    // 初回はデータがないので空の配列[]を使う
    let todos = JSON.parse(localStorage.getItem('todos')) || [];

    // --- TODOデータの保存 ---
    // TODOの配列をブラウザのlocalStorageに保存する関数
    // localStorageに保存すると、ページを閉じてもデータが残る
    function saveTodos() {
      localStorage.setItem('todos', JSON.stringify(todos));
    }

    // --- 画面の描画 ---
    // TODOデータをもとに画面を更新する関数
    function renderTodos() {
      // リストの中身を一度すべて消す
      todoList.innerHTML = '';

      // TODOが0件の場合、メッセージを表示して終了
      if (todos.length === 0) {
        todoList.innerHTML = '<p class="empty-message">TODOはありません</p>';
        return;
      }

      // TODOの配列を1つずつ処理して、画面に表示する
      todos.forEach(function (todo, index) {

        // li要素（1行分のTODOアイテム）を作る
        const li = document.createElement('li');

        // 完了済みのTODOには「done」クラスをつける（取り消し線が表示される）
        if (todo.done) {
          li.classList.add('done');
        }

        // チェックボックスを作る
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = todo.done; // 完了状態を反映
        // チェックボックスが切り替わったら、完了/未完了を切り替える
        checkbox.addEventListener('change', function () {
          toggleDone(index);
        });

        // TODOのテキストを表示するspan要素を作る
        const span = document.createElement('span');
        span.textContent = todo.text;
        // テキストをクリックしても完了/未完了を切り替えられるようにする
        span.addEventListener('click', function () {
          toggleDone(index);
        });

        // 削除ボタン（×マーク）を作る
        const deleteButton = document.createElement('button');
        deleteButton.textContent = '×';
        // 削除ボタンが押されたら、このTODOを削除する
        deleteButton.addEventListener('click', function () {
          deleteTodo(index);
        });

        // li要素の中にチェックボックス、テキスト、削除ボタンを追加する
        li.appendChild(checkbox);
        li.appendChild(span);
        li.appendChild(deleteButton);

        // 完成したli要素をリスト（ul）に追加する
        todoList.appendChild(li);
      });
    }

    // --- TODOの追加 ---
    // 新しいTODOをリストに追加する関数
    function addTodo() {
      // 入力欄のテキストを取得し、前後の空白を取り除く
      const text = todoInput.value.trim();

      // 空の場合は何もしない
      if (text === '') {
        return;
      }

      // TODOの配列に新しいアイテムを追加する
      // text: TODOの内容、done: 完了したかどうか（初期値はfalse）
      todos.push({ text: text, done: false });

      // 入力欄を空にする
      todoInput.value = '';

      // データを保存して画面を更新する
      saveTodos();
      renderTodos();
    }

    // --- TODOの完了/未完了の切り替え ---
    // 指定された番号のTODOの完了状態を反転させる関数
    function toggleDone(index) {
      todos[index].done = !todos[index].done; // true→false、false→trueに切り替え
      saveTodos();
      renderTodos();
    }

    // --- TODOの削除 ---
    // 指定された番号のTODOをリストから削除する関数
    function deleteTodo(index) {
      todos.splice(index, 1); // 配列からindex番目の要素を1つ取り除く
      saveTodos();
      renderTodos();
    }

    // --- イベントの登録 ---
    // 「追加」ボタンが押されたらaddTodoを実行する
    addButton.addEventListener('click', addTodo);

    // 入力欄でEnterキーが押されたらaddTodoを実行する
    todoInput.addEventListener('keydown', function (event) {
      if (event.key === 'Enter') {
        addTodo();
      }
    });

    // --- 初期表示 ---
    // ページを開いたときに、保存済みのTODOを画面に表示する
    renderTodos();
  </script>

</body>
</html>
